<style>
:root{
  --paper:#F7F6F2; --paper-2:#FFFFFF; --ink:#333B4D; --ink-soft:#818899;
  --rule:#E6E4DC; --stamp:#8A4C7D; --paid:#2F7D57; --due:#C24A38; --water:#2A7D91;
  --shadow:0 1px 2px rgba(51,59,77,.05);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Karla','Noto Sans Gujarati',system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.board{position:sticky;top:0;z-index:40;background:var(--paper-2);color:var(--ink);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;border-bottom:1px solid var(--rule);
  border-top:3px solid var(--stamp)}
.board .mark{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;
  letter-spacing:.18em;font-size:10.5px;color:var(--stamp)}
.board .soc{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;line-height:1.15;
  margin-top:1px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.board .sub{font-family:'Noto Sans Gujarati',sans-serif;font-size:11.5px;color:var(--ink-soft);margin-top:4px}

}
.crest{display:block;width:150px;max-width:46vw;height:auto;margin:0 0 10px}
#gate .crest{margin-bottom:14px}
.bhead{display:flex;align-items:flex-start;gap:10px}
.bleft{flex:1;min-width:0}
.outbtn{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:1px solid var(--rule);
  border-radius:4px;padding:7px 10px;color:var(--ink);background:var(--paper);
  font-family:'Noto Sans Gujarati',sans-serif;font-size:11.5px;font-weight:700;white-space:nowrap;margin-top:2px}
.outbtn svg{width:15px;height:15px;flex:0 0 15px}
.outbtn:active{background:var(--rule)}
.outbtn.back{background:var(--stamp);color:#fff;border-color:var(--stamp)}

main{padding:16px 14px 26px;max-width:660px;margin:0 auto}
.eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:11px;
  color:var(--stamp);font-weight:500;display:flex;align-items:center;gap:8px;margin:22px 0 9px}
.eyebrow:first-child{margin-top:2px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:14px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:12px 13px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Courier Prime',monospace;font-weight:700;font-size:22px;line-height:1.15}
.stat span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.stat.due b{color:var(--due)} .stat.paid b{color:var(--paid)} .stat.water b{color:var(--water)}

.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .title{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--ink-soft);margin-top:1px}
.row .grow{flex:1;min-width:0}
.row .amt{font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;white-space:nowrap}
.tag{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:2px;padding:2px 6px;white-space:nowrap}
.t-due{color:var(--due)} .t-paid{color:var(--paid)} .t-open{color:var(--stamp)}
.chip{width:48px;height:38px;flex:0 0 48px;border-radius:3px;display:grid;place-items:center;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);
  font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.03em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);
  color:var(--paper-2);border-radius:3px;padding:12px 16px;font-weight:700;font-size:14px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.stamp{background:var(--stamp)} .btn.danger{background:var(--due)} .btn.water{background:var(--water)}
.btn.sm{padding:8px 12px;font-size:12.5px}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnrow .btn{flex:1}

label{display:block;margin-top:12px}
label .lb{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:10.5px;color:var(--ink-soft)}
input,select,textarea{width:100%;margin-top:5px;background:transparent;border:0;border-bottom:1.5px solid var(--rule);padding:8px 2px;border-radius:0}
textarea{resize:vertical;min-height:74px;border:1.5px solid var(--rule);padding:8px;border-radius:3px}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--stamp)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
select{-webkit-appearance:none;appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235C6478'/></svg>") right 4px center/10px no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{margin:10px 0 0;border:1px solid var(--rule);border-radius:3px;padding:10px 12px;background:var(--paper-2)}

.empty{text-align:center;padding:28px 16px;color:var(--ink-soft)}
.empty h3{font-family:'Oswald',sans-serif;letter-spacing:.06em;color:var(--ink);margin:0 0 6px;font-size:16px;text-transform:uppercase}
.empty p{margin:0 0 14px;font-size:13.5px}

.slip{background:var(--paper-2);border:1px solid var(--rule);border-radius:2px;padding:14px;position:relative;box-shadow:var(--shadow);margin-top:12px}
.slip::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--stamp);box-shadow:0 2px 3px rgba(24,35,56,.35)}
.slip h4{margin:4px 0 5px;font-size:15.5px}
.slip p{margin:0;font-size:14px;white-space:pre-wrap}
.slip .date{font-family:'Courier Prime',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:9px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper-2);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:10px;position:relative;min-width:0}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;background:var(--stamp)}

.scrim{position:fixed;inset:0;background:rgba(24,35,56,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheetwrap{position:relative;width:100%;max-width:660px}
.sheet{background:var(--paper);width:100%;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:15px;margin:2px 0 4px}
.sheet .close{position:absolute;right:14px;top:12px;font-size:22px;line-height:1;color:var(--ink-soft);z-index:2}

/* unit entry grid */
.urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.urow .fno{font-family:'Oswald',sans-serif;font-size:13px;width:52px;flex:0 0 52px}
.urow .nm{flex:1;min-width:0;font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow input{width:64px;flex:0 0 64px;margin:0;text-align:right;font-family:'Courier Prime',monospace;font-weight:700;border-bottom:1.5px solid var(--water)}
.urow .tot{width:70px;flex:0 0 70px;text-align:right;font-family:'Courier Prime',monospace;font-size:13px}
/* per-flat monthly entry card */
.fcard{border:1px solid var(--rule);border-radius:4px;padding:9px 10px 10px;margin-top:9px;background:var(--paper-2)}
.fcard.done{opacity:.55;padding:9px 10px}
.fhead{display:flex;align-items:center;gap:9px}
.fhead .fno{font-family:'Oswald',sans-serif;font-size:13.5px;flex:0 0 auto}
.fhead .nm{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .ftot{font-family:'Courier Prime',monospace;font-weight:700;font-size:13.5px;flex:0 0 auto}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 8px;margin-top:7px}
.fgrid label{margin:0}
.fgrid span{display:block;font-size:9px;letter-spacing:.04em;color:var(--ink-soft);
  font-family:'Noto Sans Gujarati',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid input{margin-top:2px;text-align:right;font-family:'Courier Prime',monospace;font-weight:700;
  font-size:14px;padding:5px 4px;border-bottom:1.5px solid var(--rule)}
.fgrid label:nth-child(-n+3) input{border-bottom-color:var(--water)}
.fgrid label:nth-child(4) input{border-bottom-color:var(--due)}
.fgrid input.u{background:rgba(42,125,145,.07);font-weight:700}
.fcard .on{margin-top:7px;font-size:12px;padding:5px 2px}
.pvbar{position:sticky;top:0;z-index:39;background:var(--stamp);color:#fff;
  display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px}
.pvbar[hidden]{display:none}
.pvbar b{font-family:'Noto Sans Gujarati',sans-serif;font-weight:700}
.pvbar .grow{flex:1;min-width:0}
.pvbar button{background:#fff;color:var(--stamp);border-radius:3px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}

.stickybar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 0 0;margin-top:8px}

.receipt{background:var(--paper-2);border:1px solid var(--rule);padding:20px 18px;position:relative;overflow:hidden;font-family:'Courier Prime',monospace}
.receipt .perf{border-top:2px dotted var(--rule);margin:14px -18px;height:0;position:relative}
.receipt .perf::before,.receipt .perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.receipt .perf::before{left:-8px} .receipt .perf::after{right:-8px}
.receipt .rhead{text-align:center}
.receipt .rhead .n{font-family:'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--stamp)}
.receipt .rhead .s{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.receipt .line{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.receipt .line span:first-child{color:var(--ink-soft)}
.receipt .line.gu span{font-family:'Noto Sans Gujarati',sans-serif}
.receipt .total{font-size:19px;font-weight:700;border-top:1px solid var(--rule);margin-top:8px;padding-top:9px}
.stampmark{position:absolute;right:8px;bottom:34px;border:3px double var(--paid);color:var(--paid);border-radius:4px;
  padding:6px 12px;text-align:center;transform:rotate(-11deg);opacity:.88;animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) both}
.stampmark .a{font-family:'Noto Sans Gujarati',sans-serif;font-weight:700;font-size:15px;display:block}
.stampmark .b{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.22em;display:block}
@keyframes stampIn{0%{transform:rotate(-26deg) scale(2.6);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:1}100%{transform:rotate(-11deg) scale(1);opacity:.88}}
@media (prefers-reduced-motion:reduce){.stampmark,.sheet{animation:none}}

/* ---------- gate / login ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;justify-content:center;padding:26px 22px calc(30px + env(safe-area-inset-bottom));overflow:auto}
#gate[hidden]{display:none}
#gate .glogo{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:30px;line-height:1.05}
#gate .gmark{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:10.5px;color:var(--stamp)}
#gate .grule{height:0;border-top:3px solid var(--stamp);width:54px;margin:16px 0 22px}
#gate h2{font-family:'Noto Sans Gujarati',sans-serif;font-size:16px;margin:0 0 4px;font-weight:700}
#gate p{font-size:13px;color:var(--ink-soft);margin:0}
#gate .role{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:4px;
  padding:16px;margin-top:12px;background:var(--paper-2);box-shadow:var(--shadow)}
#gate .role b{display:block;font-family:'Noto Sans Gujarati',sans-serif;font-size:16px}
#gate .role span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:3px}
#gate .pin{letter-spacing:.6em;font-size:26px;text-align:center;font-family:'Courier Prime',monospace}
#gate .err{color:var(--due);font-size:13px;margin-top:12px;min-height:18px}
#gate .foot{margin-top:26px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.rolechip{font-family:'Oswald',sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--rule);color:var(--ink-soft);border-radius:2px;padding:2px 6px;margin-left:8px;vertical-align:2px}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);z-index:80;background:var(--ink);color:var(--paper-2);
  padding:10px 16px;border-radius:3px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.muted{color:var(--ink-soft);font-size:12.5px}

/* ══════════════════════════════════════════════════════════════
   Royal Rejoice-3 — letterhead layer
   Crimson + brass from the society crest. Ivory paper, serif
   figures, one brass hairline. The stamped receipt stays the
   loudest thing in the app; everything else steps back.
   ══════════════════════════════════════════════════════════════ */
:root{
  --brand:#8E0F27;        /* crest crimson */
  --brand-soft:#F6EAEC;
  --gold:#B08A44;         /* brass hairline */
  --ink:#241A1C;
  --ink-soft:#7B6F70;
  --paper:#FAF7F5;
  --paper-2:#FFFFFF;
  --rule:#ECE3DE;
  --stamp:#8E0F27;
  --paid:#26654A;
  --due:#C1462F;
  --water:#1E5C6B;
  --shadow:0 1px 2px rgba(36,26,28,.04), 0 8px 24px -18px rgba(36,26,28,.30);
}
body{
  font-family:'Manrope','Noto Sans Gujarati',system-ui,sans-serif;
  font-size:15px; letter-spacing:-.005em; color:var(--ink);
  background:var(--paper);
}
:lang(gu),.gu{font-family:'Noto Sans Gujarati','Manrope',sans-serif}
body::before{opacity:.035}

/* ── header: the nameplate ───────────────────────────────── */
.board{
  background:var(--paper-2); border-top:0;
  border-bottom:1px solid var(--rule);
  padding:calc(13px + env(safe-area-inset-top)) 18px 12px;
  box-shadow:0 1px 0 rgba(36,26,28,.02);
  position:relative;
}
.board::after{                       /* brass hairline, letterhead */
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:linear-gradient(90deg, var(--brand) 0 34%, var(--gold) 34% 46%, transparent 46%);
  opacity:.9;
}
.board .mark{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--gold);
}
.board .soc{
  font-family:'Cormorant Garamond',serif; font-weight:600; font-size:27px;
  letter-spacing:.005em; text-transform:none; color:var(--brand);
  line-height:1.1; margin-top:2px;
}
.board .sub{
  font-family:'Noto Sans Gujarati',sans-serif; font-size:11px;
  color:var(--ink-soft); margin-top:5px; letter-spacing:0;
}
.rolechip{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:8.5px;
  letter-spacing:.16em; border:0; background:var(--brand-soft);
  color:var(--brand); border-radius:100px; padding:3px 8px; margin-left:7px;
}
.outbtn{
  border:1px solid var(--rule); border-radius:100px; padding:7px 13px;
  font-family:'Noto Sans Gujarati',sans-serif; font-size:11px; font-weight:600;
  background:var(--paper-2); color:var(--ink-soft);
}
.outbtn:active{background:var(--paper)}
.outbtn.back{background:var(--brand); color:#fff; border-color:var(--brand)}

/* ── section labels ──────────────────────────────────────── */
.eyebrow{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--brand);
  margin:26px 0 10px; gap:10px;
}
.eyebrow::after{background:var(--rule); height:1px}

/* ── cards ───────────────────────────────────────────────── */
.card{
  background:var(--paper-2); border:1px solid var(--rule);
  border-radius:10px; padding:16px; box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}

/* ── figures: serif, like a statement not a spreadsheet ──── */
.stat{border-radius:10px; padding:14px 15px; box-shadow:var(--shadow)}
.stat b{
  font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:31px; line-height:1.05; letter-spacing:-.01em;
}
.stat span{font-size:11px; color:var(--ink-soft); margin-top:5px; letter-spacing:.01em}
.row .amt{
  font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:19px; letter-spacing:0;
}
.row .title{font-weight:700; font-size:14px; letter-spacing:-.01em}
.row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px}
.row{padding:12px 0}

/* ── flat / shop plate ───────────────────────────────────── */
.chip{
  background:var(--brand-soft); color:var(--brand); border:0;
  border-radius:8px; font-family:'Manrope',sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.02em; width:50px; flex:0 0 50px; height:40px;
}
.tag{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9px;
  letter-spacing:.12em; border-radius:100px; padding:3px 9px;
}

/* ── buttons ─────────────────────────────────────────────── */
.btn{
  border-radius:100px; font-family:'Noto Sans Gujarati',sans-serif;
  font-weight:700; font-size:14px; padding:13px 20px; letter-spacing:.01em;
  background:var(--ink); color:#fff;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(1px)}
.btn.stamp{background:var(--brand); box-shadow:0 6px 16px -10px var(--brand)}
.btn.water{background:var(--water)}
.btn.danger{background:var(--due)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--rule)}
.btn.ghost:active{background:var(--paper)}
.btn.sm{padding:9px 15px; font-size:12.5px}

/* ── forms ───────────────────────────────────────────────── */
label .lb, .fgrid span{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.fgrid span{letter-spacing:.02em; text-transform:none; font-size:9.5px;
  font-family:'Noto Sans Gujarati',sans-serif}
input,select,textarea{border-bottom-width:1px}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--brand)}
textarea{border-radius:8px; border-width:1px}
.search{border-radius:100px; padding:11px 16px}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--brand); outline-offset:2px}

/* ── bottom bar ──────────────────────────────────────────── */
.tabs{background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-top:1px solid var(--rule)}
.tabs button{font-family:'Noto Sans Gujarati',sans-serif; font-size:9.5px; font-weight:600}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"]::before{background:var(--brand); width:20px; height:2.5px; border-radius:0 0 3px 3px}

/* ── notice slip ─────────────────────────────────────────── */
.slip{border-radius:10px; padding:16px; box-shadow:var(--shadow)}
.slip::before{background:var(--gold); width:9px; height:9px; top:-5px}
.slip h4{font-family:'Noto Serif Gujarati',serif; font-weight:600; font-size:16px}

/* ── sheets ──────────────────────────────────────────────── */
.sheet{border-radius:20px 20px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{
  font-family:'Noto Serif Gujarati',serif; font-weight:600; font-size:18px;
  text-transform:none; letter-spacing:0; color:var(--ink);
}
.sheet .close{color:var(--ink-soft)}

/* ── login ───────────────────────────────────────────────── */
#gate{background:var(--paper); padding:28px 24px calc(32px + env(safe-area-inset-bottom))}
#gate .crest{width:132px; margin:0 auto 6px}
#gate .gmark{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.24em; color:var(--gold); text-align:center;
}
#gate .grule{
  width:44px; margin:14px auto 20px; border-top:2px solid var(--brand);
}
#gate h2{font-family:'Noto Serif Gujarati',serif; font-weight:600; font-size:19px; text-align:center}
#gate p{text-align:center; font-size:13px; line-height:1.6}
#gate .role{border-radius:12px; padding:17px 18px; box-shadow:var(--shadow)}
#gate .role b{font-family:'Noto Serif Gujarati',serif; font-weight:600}
#gate .pin{letter-spacing:.55em; font-size:24px}
#gate .foot{text-align:center; margin-top:22px; line-height:1.7}
.credit{
  text-align:center; margin-top:20px; font-family:'Manrope',sans-serif;
  font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);
}
.credit b{color:var(--brand); font-weight:700; letter-spacing:.14em}
.credit .hr{
  display:block; width:28px; height:1px; background:var(--gold);
  margin:0 auto 12px; opacity:.7;
}

/* ── entry cards ─────────────────────────────────────────── */
.fcard{border-radius:10px; padding:11px 12px 12px}
.fhead .fno{font-family:'Manrope',sans-serif; font-weight:800; font-size:12.5px; letter-spacing:.02em; color:var(--brand)}
.fhead .ftot{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:16px}
.stickybar{background:linear-gradient(to top, var(--paper) 78%, transparent)}

/* ── keep the receipt exactly as it is: it's the signature ── */
.receipt{border-radius:10px}
.receipt .rhead .s{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px;
  letter-spacing:.01em; text-transform:none; color:var(--brand)}
.receipt .rhead .n{color:var(--gold); font-family:'Manrope',sans-serif; font-weight:700}
.receipt .total{font-family:'Cormorant Garamond',serif; font-size:22px}

.pvbar{background:var(--brand)}
#toast{border-radius:100px; background:var(--ink); font-family:'Noto Sans Gujarati',sans-serif; padding:11px 18px}
.empty h3{font-family:'Noto Serif Gujarati',serif; font-weight:600; text-transform:none; letter-spacing:0; font-size:17px}
.muted{font-size:12px; line-height:1.65}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }

#gate .crest{width:168px;max-width:52vw;margin:0 auto 4px}
.card img.crest, .card img[alt="Royal Rejoice-3"]{filter:none}

/* on/off switch */
.sw{width:46px;height:27px;flex:0 0 46px;border-radius:100px;background:var(--rule);
  position:relative;transition:background .18s ease;border:0;padding:0;cursor:pointer}
.sw.on{background:var(--paid)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(36,26,28,.28);transition:transform .18s ease}
.sw.on::after{transform:translateX(19px)}
.sw:disabled{cursor:not-allowed}

/* update banner */
.updbar{position:fixed;left:0;right:0;top:0;z-index:95;display:flex;align-items:center;gap:10px;
  background:var(--brand);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-top));
  font-family:'Noto Sans Gujarati',sans-serif;font-size:12.5px;font-weight:600;
  box-shadow:0 6px 20px -12px rgba(36,26,28,.6)}
.updbar[hidden]{display:none}
.updbar span{flex:1;min-width:0}
.updbar button{background:#fff;color:var(--brand);border-radius:100px;padding:6px 13px;
  font-family:'Noto Sans Gujarati',sans-serif;font-size:12px;font-weight:700;white-space:nowrap}
.updbar #updClose{background:transparent;color:rgba(255,255,255,.8);padding:6px 2px;font-size:15px}

/* ══════════════════════════════════════════════════════════════
   Supreme layer — depth, rhythm and one hero moment.
   Nothing new is added; existing pieces are given weight,
   alignment and restraint.
   ══════════════════════════════════════════════════════════════ */
:root{
  --brand-deep:#6E0A1E;
  --e1:0 1px 2px rgba(36,26,28,.05);
  --e2:0 1px 2px rgba(36,26,28,.05), 0 10px 28px -20px rgba(36,26,28,.34);
  --e3:0 2px 6px rgba(36,26,28,.06), 0 22px 48px -28px rgba(110,10,30,.40);
}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #FFFDFC 0%, transparent 60%),
    var(--paper);
  font-feature-settings:"ss01","cv01";
}
.row .amt,.stat b,.fhead .ftot,.receipt .line span:last-child,.hero .n{
  font-variant-numeric:tabular-nums lining-nums;
}

/* ── entrance: one calm stagger, never on repeat interaction ── */
@keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view > *{animation:riseIn .34s cubic-bezier(.22,.7,.3,1) both}
#view > *:nth-child(1){animation-delay:.01s}
#view > *:nth-child(2){animation-delay:.04s}
#view > *:nth-child(3){animation-delay:.07s}
#view > *:nth-child(4){animation-delay:.10s}
#view > *:nth-child(5){animation-delay:.13s}
#view > *:nth-child(n+6){animation-delay:.15s}

/* ── the hero: the month's money, stated once, with authority ── */
.hero{
  position:relative; overflow:hidden; border-radius:16px; padding:20px 20px 18px;
  background:linear-gradient(152deg, var(--brand) 0%, var(--brand-deep) 100%);
  color:#fff; box-shadow:var(--e3); margin-top:2px;
}
.hero::after{                       /* brass hairline, top-left, like a seal band */
  content:""; position:absolute; top:0; left:20px; width:54px; height:2px;
  background:var(--gold);
}
.hero .lbl{
  font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.62);
  margin-top:6px;
}
.hero .n{
  font-family:'Cormorant Garamond',serif; font-weight:600; line-height:1;
  font-size:46px; letter-spacing:-.015em; margin-top:6px; display:block;
}
.hero .sub{font-size:11.5px; color:rgba(255,255,255,.7); margin-top:7px; line-height:1.5}
.hero .split{
  display:flex; gap:18px; margin-top:16px; padding-top:14px;
  border-top:1px solid rgba(255,255,255,.16);
}
.hero .split div{flex:1; min-width:0}
.hero .split b{
  display:block; font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:23px; line-height:1.1;
}
.hero .split span{
  display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  font-family:'Manrope',sans-serif; font-weight:700; color:rgba(255,255,255,.55); margin-top:4px;
}
.hero .split .due b{color:#FFC9BC}
.hero .split .paid b{color:#BFEBD3}

/* ── surfaces: finer edge, real depth ─────────────────────── */
.card,.slip,.stat,.fcard{border-color:#F0E8E3; box-shadow:var(--e2)}
.card{border-radius:14px}
.stat{border-radius:14px}
.slip{border-radius:14px}
.fcard{border-radius:12px}

/* dividers align with content, not the card edge */
.card .row{border-bottom-color:#F3ECE8}
.card .row:last-child{border-bottom:0}

/* ── touch feedback ──────────────────────────────────────── */
.btn{box-shadow:var(--e1); transition:transform .14s cubic-bezier(.22,.7,.3,1), box-shadow .14s ease, opacity .14s}
.btn:active{transform:scale(.975)}
.btn.stamp{box-shadow:0 2px 8px -3px rgba(142,15,39,.45), 0 10px 24px -14px rgba(142,15,39,.6)}
.card:active,.slip:active{transition:none}
.chip{box-shadow:inset 0 0 0 1px rgba(142,15,39,.07)}
.row .grow{padding-right:2px}

/* ── header: a touch more presence ───────────────────────── */
.board{background:rgba(255,255,255,.92); backdrop-filter:saturate(180%) blur(14px)}
.board .soc{font-size:28px; letter-spacing:0}
.board::after{background:linear-gradient(90deg, var(--brand) 0 30%, var(--gold) 30% 41%, transparent 41%)}

/* ── bottom bar: a soft pill marks where you are ─────────── */
.tabs button[aria-current="page"]::before{display:none}
.tabs button[aria-current="page"] svg{
  background:var(--brand-soft); border-radius:10px; padding:4px; margin:-4px -4px 0;
}
.tabs button svg{transition:background .18s ease}

/* ── login: a considered first impression ────────────────── */
#gate{
  background:
    radial-gradient(105% 46% at 50% 6%, #FFF7F4 0%, transparent 62%),
    var(--paper);
}
#gate .crest{width:184px; max-width:56vw; filter:drop-shadow(0 12px 26px rgba(110,10,30,.14))}
#gate h2{font-size:21px; letter-spacing:-.01em; margin-top:2px}
#gate .grule{width:38px; border-top-width:2px; margin:16px auto 22px}
#gate .role{border-radius:14px; box-shadow:var(--e2)}
#gate .btn{padding:15px 20px; font-size:14.5px}
#gate label{margin-top:16px}

/* ── sheets & receipt ────────────────────────────────────── */
.sheet{border-radius:24px 24px 0 0; box-shadow:0 -18px 50px -24px rgba(36,26,28,.42)}
.scrim{background:rgba(36,26,28,.42); backdrop-filter:blur(2px)}
.receipt{border-radius:14px; box-shadow:var(--e2)}

/* ── empty states read as intentional, not broken ────────── */
.empty{padding:34px 18px}
.empty h3{font-size:18px; margin-bottom:8px}
.empty p{max-width:34ch; margin-left:auto; margin-right:auto}

/* ── switches ────────────────────────────────────────────── */
.sw{box-shadow:inset 0 1px 2px rgba(36,26,28,.10)}
.sw.on{box-shadow:inset 0 1px 2px rgba(0,0,0,.14), 0 2px 8px -3px rgba(38,101,74,.5)}

.eyebrow{margin:28px 0 11px}
main{padding:18px 15px 28px}

/* login: the primary action carries the brand */
#gate .btn:not(.ghost){background:var(--brand); color:#fff;
  box-shadow:0 2px 10px -4px rgba(142,15,39,.5), 0 14px 30px -18px rgba(142,15,39,.7)}
/* a ring, not a box */
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none; box-shadow:0 0 0 3px rgba(142,15,39,.14); border-radius:6px}
button:focus-visible{outline:2px solid var(--brand); outline-offset:3px}
.btnrow .btn.full{flex:1 0 100%}

/* bill rows: the amount forms a clean right-hand column */
.card .row .amt{min-width:74px; text-align:right}

/* ---------- crypto ---------- */
/* Data is encrypted on the device with a key that only your PIN can open.
   Needs a secure context (https / installed app). Opened as a plain file
   (file://) the browser gives us no crypto, so we run unencrypted and say so. */
const SUB = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle : null;
const CRYPTO_OK = !!SUB;
const te = new TextEncoder(), tdec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const randB64 = n => b64(crypto.getRandomValues(new Uint8Array(n)));

async function sha256(str){
  if(!SUB) return 'plain:' + str;
  return b64(await SUB.digest('SHA-256', te.encode(str)));
}
async function deriveKEK(pin, saltB64, iters){
  const base = await SUB.importKey('raw', te.encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return SUB.deriveKey(
    { name:'PBKDF2', salt:unb64(saltB64), iterations: iters || 150000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['wrapKey','unwrapKey']);
}

async function wrapFor(pin, dataKey, iters){
  const salt = randB64(16), iv = randB64(12);
  const kek = await deriveKEK(pin, salt, iters);
  const wrapped = await SUB.wrapKey('raw', dataKey, kek, { name:'AES-GCM', iv:unb64(iv) });
  return { salt, iv, wrapped: b64(wrapped) };
}

  const kek = await deriveKEK(pin, acc.salt, iters);
  return SUB.unwrapKey('raw', unb64(acc.wrapped), kek, { name:'AES-GCM', iv:unb64(acc.iv) },
    { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);
}

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await SUB.encrypt({name:'AES-GCM', iv}, dataKey, te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptBlob(dataKey, blob){
  const pt = await SUB.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, dataKey, unb64(blob.ct));
  return JSON.parse(tdec.decode(pt));
}

let dataKey = null;          // held in memory only while unlocked

let rosterSig = '';          // rebuild only when the flat list actually changes
const ROSTER_ITERS = 60000;

// the resident proves they belong with two facts: their number and their flat number
const signupSecret = (phone, flatNo) =>
  digits(phone) + '|' + String(flatNo||'').toUpperCase().replace(/\s+/g,'');

async function buildRoster(force){
  if (!CRYPTO_OK || !dataKey || !db.sec || !db.sec.selfSignup || !db.sec.encrypt){
    roster = []; rosterSig = ''; return;
  }
  const sig = db.flats.map(f=>f.id+':'+digits(f.phone)+':'+f.no).join(',');
  if (!force && sig === rosterSig && roster.length) return;
  const next = [];
  for (const f of db.flats){
    if (!digits(f.phone)) continue;
    const secret = signupSecret(f.phone, f.no);
    const w = await wrapFor(secret, dataKey, ROSTER_ITERS);
    next.push({ h: await sha256(secret), fid: f.id, ...w });
  }
  roster = next; rosterSig = sig;
}

/* ---------- raw storage ---------- */
const raw = {
  async get(k){
    try{ if (window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; }
  },
  async set(k, v){
    const s = JSON.stringify(v);
    try{ if (window.storage){ await window.storage.set(k, s); return; } }catch(e){}
    try{ localStorage.setItem(k, s); }catch(e){}
  }
};

async function save(){
  if (!db.sec) db.sec = defaultSec();
  if (CRYPTO_OK && dataKey && db.sec.encrypt){
    // security preferences are not secrets, and the app needs them before unlock
    await buildRoster(false);
    await raw.set(KEY, { enc:1, accounts, sec: db.sec, roster, blob: await encryptBlob(dataKey, db) });
  } else {
    await raw.set(KEY, db);           // no crypto available: plain, and the app says so

}

async function getLock(){ return (await raw.get(LKEY)) || { fails:0, until:0 }; }
async function bumpFail(){
  if (db.sec && db.sec.attempts === false) return { fails:0, until:0 };
  const l = await getLock(); l.fails = (l.fails||0)+1;
  if (l.fails >= 5) l.until = Date.now() + Math.min(30*60000, 60000 * Math.pow(2, l.fails-5));
  await raw.set(LKEY, l); return l;
}
async function clearFail(){ await raw.set(LKEY, { fails:0, until:0 }); }

const isMember = () => session && session.role === 'member';
const isBilling = () => session && session.role === 'billing';
const ROLE_NAME = { admin:'એડમિન', billing:'બિલિંગ', guard:'સિક્યોરિટી', member:'રહેવાસી' };
const myFlat = () => session && session.flatId ? flatOf(session.flatId) : null;

/* ---------- auto-lock on inactivity ---------- */
let lockTimer = null;
function armLock(){
  clearTimeout(lockTimer);
  if (!session || !db.sec || !db.sec.autolock) return;
  const mins = db.sec.lockMin || 5;
  lockTimer = setTimeout(() => lockNow(true), mins * 60000);
}
async function lockNow(auto){
  if (!session) return;
  session = null; dataKey = null; await sess.set(null);
  db = emptyDb();
  const st = await raw.get(KEY);              // keep the security prefs across the lock
  if (st && st.sec) db.sec = Object.assign(defaultSec(), st.sec);
  gateStep = 'login'; renderGate();
  if (auto) toast(`વપરાશ ન થતાં એપ લોક થઈ`);
}
['click','keydown','touchstart','scroll'].forEach(ev =>
  document.addEventListener(ev, () => { if (session) armLock(); }, { passive:true }));
document.addEventListener('visibilitychange', () => { if (document.hidden && session) armLock(); });

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,9);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const money = n => '₹' + new Intl.NumberFormat('en-IN').format(Math.round(n||0));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey = d => { d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthLabel = k => { const [y,m]=k.split('-'); return MONTHS_GU[+m-1]+' '+y; };
const today = () => new Date().toISOString().slice(0,10);
const dateLabel = s => { if(!s) return '—'; const d=new Date(s); return d.getDate()+' '+MONTHS_GU[d.getMonth()]+' '+d.getFullYear(); };
const flatOf = id => db.flats.find(f=>f.id===id);
const isShop = f => f && f.kind === 'shop';
const defMaint = f => isShop(f) ? (db.society.shopMaint ?? 500) : db.society.maint;
const defRate  = f => isShop(f) ? (db.society.shopUnitRate ?? 3) : db.society.unitRate;
const nFlats = () => db.flats.filter(f=>!isShop(f)).length;
const nShops = () => db.flats.filter(isShop).length;
const flatName = id => flatOf(id)?.no || '—';
const monthCharges = b => (b.maint||0) + (b.units||0)*(b.unitRate||0) + (b.parking||0) + (b.other||0) + (b.penalty||0);
const billTotal = b => monthCharges(b) + (b.carry||0);
const waterAmt = b => (b.units||0)*(b.unitRate||0);
const hasRead = b => b && (b.prevRead != null || b.currRead != null);
const readLine = b => hasRead(b) ? `${b.prevRead||0} → ${b.currRead||0}` : '';
const usedUnits = (pr, cr) => Math.max(0, (+cr||0) - (+pr||0));
// last month's closing reading becomes this month's opening reading
const lastRead = (flatId, month) => {
  const past = db.bills.filter(x=>x.flatId===flatId && x.month < month && x.currRead != null)
                       .sort((a,b)=>b.month.localeCompare(a.month));
  return past.length ? past[0].currRead : null;
};
const isDue = b => b.status !== 'paid' && b.status !== 'carried';
const prevDue = b => b.carry || 0;
const grand = b => billTotal(b);
const autoCarry = (flatId, month) => db.bills
  .filter(x => x.flatId===flatId && x.month < month && isDue(x))
  .reduce((s,x)=>s+billTotal(x), 0);
const hasExtra = b => (b.parking||0)||(b.other||0)||(b.penalty||0);
const extraLine = b => [ (b.parking?`પાર્કિંગ ${money(b.parking)}`:''),
                         (b.other?`${esc(b.otherNote||'અન્ય')} ${money(b.other)}`:''),
                         (b.penalty?`પેનલ્ટી ${money(b.penalty)}`:'') ].filter(Boolean).join(' · ');
const prevMonth = k => { const [y,m]=k.split('-').map(Number); const d=new Date(y,m-2,1); return monthKey(d); };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }

function openSheet(html){ $('#sheet').innerHTML=html; $('#scrim').hidden=false; document.body.style.overflow='hidden'; }
function closeSheet(){ $('#scrim').hidden=true; $('#sheet').innerHTML=''; document.body.style.overflow=''; }
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', e => { if(e.target===$('#scrim')) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });

const TABS_ADMIN = [['home','હિસાબ'],['flats','ફ્લેટ'],['bills','બિલ'],['notices','નોટિસ'],['data','ડેટા'],['more','સેટિંગ']];
const TABS_MEMBER = [['home','ઘર'],['mybills','મારાં બિલ'],['notices','નોટિસ'],['mycomp','ફરિયાદ']];
const TABS_GUARD = [['home','ગેટ'],['gvis','મુલાકાતી'],['gdir','ડિરેક્ટરી'],['notices','નોટિસ']];
const TABS_BILL  = [['bills','બિલ'],['flats','યાદી'],['notices','નોટિસ']];
const tabsFor = () => isAdmin() ? TABS_ADMIN : isGuard() ? TABS_GUARD : isBilling() ? TABS_BILL : TABS_MEMBER;
function renderTabs(){
  const T = tabsFor();
  $('#tabs').style.gridTemplateColumns = `repeat(${T.length},1fr)`;
  $('#tabs').innerHTML = T.map(([id,l])=>`<button data-tab="${id}" ${tab===id?'aria-current="page"':''}>
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||ICONS.more}</svg><span>${l}</span></button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  tab=b.dataset.tab; render(); window.scrollTo({top:0});
});

/* ============================ VIEWS ============================ */
function render(){
  if (!session){ renderGate(); return; }
  $('#gate').hidden = true;
  const f = myFlat();
  $('#pvbar').hidden = !session.preview;
  const ob = $('#outBtn');
  if (session.preview){ ob.dataset.a='exitpreview'; ob.classList.add('back'); $('#outTxt').textContent='પાછા'; }
  else { ob.dataset.a='logout'; ob.classList.remove('back'); $('#outTxt').textContent='લોગ આઉટ'; }
  if (session.preview) $('#pvFlat').textContent = isGuard()
    ? (guardUser()?.name || 'સિક્યોરિટી')
    : `${f?.no||''} · ${f?.owner||''}`;
  $('#roleChip').textContent = isAdmin() ? 'એડમિન' : isBilling() ? 'બિલિંગ' : isGuard() ? 'સિક્યોરિટી'
    : (session.preview ? 'પ્રીવ્યૂ' : esc(f?.no || 'રહેવાસી'));
  if (isAdmin()){
    const due = db.bills.filter(b=>isDue(b)).reduce((s,b)=>s+billTotal(b),0);
    $('#socSub').textContent = `${nFlats()} ફ્લેટ · ${nShops()} શોપ · મેન્ટેનન્સ ${money(db.society.maint)}/${money(db.society.shopMaint)} · બાકી ${money(due)}`;
  } else if (isGuard()){
    const t = today();
    const inToday = db.visitors.filter(v=>v.date===t).length;
    const inside = db.visitors.filter(v=>!v.out).length;
    $('#socSub').textContent = `${esc(guardUser()?.name||'સિક્યોરિટી')} · આજે ${inToday} એન્ટ્રી · ${inside} અંદર`;
  } else {
    const myDue = db.bills.filter(b=>b.flatId===session.flatId && isDue(b)).reduce((s,b)=>s+billTotal(b),0);
    $('#socSub').textContent = `${f?.owner||''} · ${myDue ? 'બાકી '+money(myDue) : 'કોઈ બાકી નથી'}`;
  }
  const views = {home:isAdmin()?vHome:isGuard()?vGuardHome:isBilling()?vBills:vMemberHome, flats:vFlats, bills:vBills,
                 notices:vNotices, more:vMore, mybills:vMyBills, mycomp:vMyComp,
                 gvis:vVisitorLog, gdir:vDirectory, data:vData};
  if (!tabsFor().some(t=>t[0]===tab)) tab = tabsFor()[0][0];
  renderTabs();
  (views[tab] || views.home)();
}

const GHEAD = `<img class="crest" src="${CREST}" alt="Royal Rejoice-3"><div class="gmark">Society Manager</div><div class="grule"></div>`;
const ADMIN_DEFAULT = { phone:'2911', pin:'2911' };
const GUARD_DEFAULT = { phone:'1911', pin:'1911' };
let pendingFlat = null;   // flat matched during signup

const defaultSec = () => ({ encrypt:true, autolock:true, lockMin:5, attempts:true, maskPhone:true, selfSignup:true });

function emptyDb(){
  return { society:{ name:'Royal Rejoice - 3', address:'', maint:800, unitRate:10, penalty:100,
                     shopMaint:500, shopUnitRate:3 },
           auth:{}, users:[], flats:[], bills:[], notices:[], complaints:[],
           visitors:[], expenses:[], sec:defaultSec(), v:3 };
}

/* rebuild the pre-login account index from the (unlocked) user list */
async function syncAccounts(){
  if (!CRYPTO_OK || !dataKey) return;
  const next = [];
  for (const u of db.users){
    const old = accounts.find(a => a.id === u.id);
    if (old && !u._newPin){ next.push({ ...old, role:u.role, phoneHash: await sha256(u.phone) }); }
    else {
      const w = await wrapFor(u._newPin || u.pin, dataKey);
      next.push({ id:u.id, role:u.role, phoneHash: await sha256(u.phone), ...w });
    }
    delete u._newPin;
  }
  accounts = next;
}

function ensureUsers(){
  if (!Array.isArray(db.users)) db.users = [];
  const old = db.auth || {};
  if (!db.users.some(u=>u.role==='admin'))
    db.users.push({ id:uid(), role:'admin', phone:ADMIN_DEFAULT.phone,
      pin: old.pin || ADMIN_DEFAULT.pin, name: old.admin || 'એડમિન', flatId:null });
  if (!db.users.some(u=>u.role==='guard'))
    db.users.push({ id:uid(), role:'guard', phone:GUARD_DEFAULT.phone,
      pin: old.guardPin || GUARD_DEFAULT.pin, name: old.guard || 'ગેટ સિક્યોરિટી', flatId:null });
}
const digits = v => String(v||'').replace(/\D/g,'');
// guards can call a resident without being able to read or copy the number
const maskPhone = p => { const d = digits(p); return d.length<6 ? d : d.slice(0,2)+'••••••'+d.slice(-2); };
const userByPhone = p => db.users.find(u => u.phone === digits(p));
const adminUser = () => db.users.find(u=>u.role==='admin');
const guardUser = () => db.users.find(u=>u.role==='guard');
const memberUsers = () => db.users.filter(u=>u.role==='member');
const flatsForPhone = p => db.flats.filter(f => digits(f.phone) && digits(f.phone) === digits(p));
const usingDefaults = () => (adminUser()?.pin === ADMIN_DEFAULT.pin) || (guardUser()?.pin === GUARD_DEFAULT.pin);

function renderGate(){
  const g = $('#gate'); g.hidden = false;
  ensureUsers();

  /* ---------- step 2 of signup: choose a PIN ---------- */
  if (gateStep === 'setpin' && pendingFlat){
    g.innerHTML = `${GHEAD}
      <h2>તમારો PIN બનાવો</h2>
      <p>નંબર મળી ગયો. હવે ૪ આંકડાનો PIN નક્કી કરો — દર વખતે એનાથી લોગિન થશે.</p>
      <div class="role" style="margin-top:14px">
        <b>${esc(pendingFlat.no)} · ${esc(pendingFlat.owner||'નામ નથી')}</b>
        <span>${esc(pendingFlat.phone)}</span>
      </div>
      <label><span class="lb">નવો PIN (૪ આંકડા)</span><input id="gp" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
      <label><span class="lb">PIN ફરી લખો</span><input id="gp2" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
      <div class="err" id="ge"></div>
      <button class="btn full" id="gok">ખાતું બનાવો</button>
      <div class="btnrow"><button class="btn ghost full" data-g="signup">પાછા જાઓ</button></div>`;
    const go = async () => {
      const p=$('#gp').value.trim(), p2=$('#gp2').value.trim();
      if(!/^\d{4}$/.test(p)) return gerr('PIN બરાબર ૪ આંકડાનો હોવો જોઈએ');
      if(p!==p2) return gerr('બંને PIN સરખા નથી');
      const u = { id:uid(), role:'member', phone:digits(pendingFlat.phone), pin:p,
                  name:pendingFlat.owner||'', flatId:pendingFlat.id, joined:today(), _newPin:p };
      db.users.push(u);
      if (CRYPTO_OK && !dataKey) dataKey = await newDataKey();
      await syncAccounts(); await save();
      const f = pendingFlat; pendingFlat = null;
      await login({ role:'member', flatId:f.id, userId:u.id });
    };
    $('#gok').addEventListener('click', go);
    $('#gp2').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    focusFix();
    return;
  }

  /* ---------- locked: the roster can't be read, so ask the admin ---------- */
  if (gateStep === 'ask'){
    g.innerHTML = `${GHEAD}
      <h2>એડમિન પાસે ખાતું બનાવડાવો</h2>
      <p>સુરક્ષા માટે સોસાયટીની યાદી તાળામાં છે, એટલે જાતે સાઇન અપ થતું નથી.

      <div class="btnrow"><button class="btn ghost full" data-g="login">ખાતું મળી ગયું? લોગિન કરો</button></div>
      <div class="foot">એડમિન ખાતું બનાવે એટલે તમને તમારો લોગિન નંબર અને PIN મળશે.<br>
        લોગિન થયા પછી PIN બદલી લેજો.</div>
      <div class="credit"><span class="hr"></span>Developed by <b>Maulik Panchal</b><br>
        <span style="opacity:.6">${APP_VERSION}</span></div>`;
    $('#gask').addEventListener('click', ()=>{
      const n = digits($('#gnum') ? $('#gnum').value : '');
      window.open('https://wa.me/?text=' + encodeURIComponent(
        `નમસ્તે, Royal Rejoice-3 એપમાં મારું ખાતું બનાવી આપશો?\n\nમારો મોબાઇલ નંબર: ${n||'…'}\nફ્લેટ / શોપ નં.: …\n\nઆભાર 🙏`), '_blank');
    });
    return;
  }

  /* ---------- login ---------- */
  if (gateStep === 'login'){
    g.innerHTML = `${GHEAD}
      <h2>લોગિન</h2>
      <p>તમારો મોબાઇલ નંબર અને PIN લખો.</p>
      <label><span class="lb">મોબાઇલ નંબર</span><input id="gnum" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX"></label>
      <label><span class="lb">PIN</span><input id="gp" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
      <div class="err" id="ge"></div>
      <button class="btn full" id="gok">લોગિન</button>
      <div class="btnrow"><button class="btn ghost full" data-g="signup">નવા છો? સાઇન અપ કરો</button></div>
      <div class="foot">PIN ભૂલી ગયા હો તો એડમિનને કહો — એ રીસેટ કરી આપશે.</div>
      <div class="credit"><span class="hr"></span>Developed by <b>Maulik Panchal</b><br>
        <span style="opacity:.6">${APP_VERSION}</span></div>`;
    const go = async () => {
      const lk = await getLock();
      if (lk.until && Date.now() < lk.until && !(db.sec && db.sec.attempts === false)){
        const mins = Math.ceil((lk.until - Date.now())/60000);
        return gerr(`ઘણી વાર ખોટો PIN પડ્યો — ${mins} મિનિટ પછી ફરી પ્રયત્ન કરો`);
      }
      const num = digits($('#gnum').value), p = $('#gp').value.trim();
      if(num.length < 4 || p.length < 4) return gerr('નંબર અને ૪ આંકડાનો PIN લખો');

      const stAll = await raw.get(KEY);
      if (CRYPTO_OK && stAll && stAll.enc && accounts.length){
        const h = await sha256(num);
        const acc = accounts.find(a => a.phoneHash === h);
        if(!acc){ await bumpFail(); return gerr('નંબર કે PIN ખોટો છે'); }
        try{
          const dk = await unwrapWith(p, acc);
          db = await decryptBlob(dk, stAll.blob);
          if (!db.sec) db.sec = defaultSec();
          dataKey = dk;
        }catch(err){
          const l = await bumpFail();
          const left = Math.max(0, 5 - l.fails);
          return gerr(left ? `નંબર કે PIN ખોટો છે — ${left} પ્રયત્ન બાકી` : 'ઘણી વાર ખોટું પડ્યું — થોડી વાર રાહ જુઓ');
        }
        await clearFail();
        const u = db.users.find(x => x.id === acc.id) || {};
        return login({ role:u.role||acc.role, flatId:u.flatId||null, userId:acc.id });
      }

      // encryption off (or unavailable): read the saved file back before checking,
      // because locking clears the in-memory copy
      if (stAll && !stAll.enc && typeof stAll === 'object'){
        db = Object.assign(emptyDb(), stAll);
        db.sec = Object.assign(defaultSec(), db.sec || {});
        ensureUsers();
      }
      const u = userByPhone(num);
      if(!u || u.pin !== p){ await bumpFail(); return gerr('નંબર કે PIN ખોટો છે'); }
      await clearFail();
      await login({ role:u.role, flatId:u.flatId||null, userId:u.id });
    };
    $('#gok').addEventListener('click', go);
    $('#gp').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    setTimeout(()=>{ const i=$('#gnum'); if(i) i.focus(); }, 120);
    return;
  }

  /* ---------- signup (first page) ---------- */
  g.innerHTML = `${GHEAD}
    <h2>સાઇન અપ</h2>
    <p>સોસાયટીમાં નોંધાયેલો તમારો મોબાઇલ નંબર લખો. નંબર મળશે એટલે તમારો ફ્લેટ આપોઆપ જોડાઈ જશે.</p>
    <label><span class="lb">મોબાઇલ નંબર (૧૦ આંકડા)</span><input id="gnum" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX"></label>
    ${(CRYPTO_OK && roster.length && !dataKey)
      ? `<label><span class="lb">તમારો ફ્લેટ / શોપ નંબર</span>
          <input id="gflat" placeholder="A-101 કે Shop 3"></label>` : ''}
    <div class="err" id="ge"></div>
    <button class="btn full" id="gok">આગળ વધો</button>
    <div class="btnrow"><button class="btn ghost full" data-g="login">પહેલેથી ખાતું છે? લોગિન કરો</button></div>
    <div class="foot">નંબર યાદીમાં ન હોય કે બદલાયો હોય તો એડમિનને કહી અપડેટ કરાવો.</div>
    <div class="credit"><span class="hr"></span>Developed by <b>Maulik Panchal</b><br>
      <span style="opacity:.6">${APP_VERSION}</span></div>`;
  const go = async () => {
    const n = digits($('#gnum').value);
    if(n.length !== 10) return gerr('૧૦ આંકડાનો મોબાઇલ નંબર લખો');
    // data locked: prove membership with number + flat number, which unwraps the key
    if (CRYPTO_OK && accounts.length && !dataKey){
      if (!roster.length){ gateStep = 'ask'; renderGate(); return; }
      const fno = ($('#gflat') ? $('#gflat').value : '').trim();
      if (!fno) return gerr('તમારો ફ્લેટ / શોપ નંબર પણ લખો');
      const secret = signupSecret(n, fno);
      const h = await sha256(secret);
      const ent = roster.find(x => x.h === h);
      if (!ent) return gerr('નંબર અને ફ્લેટ નંબર મળતા નથી — બરાબર લખો કે એડમિનને પૂછો');
      gerr('તપાસાય છે…');
      try{
        const dk = await unwrapWith(secret, ent, ROSTER_ITERS);
        const stAll = await raw.get(KEY);
        db = await decryptBlob(dk, stAll.blob);
        db.sec = Object.assign(defaultSec(), db.sec || {});
        dataKey = dk;
      }catch(err){ return gerr('ચકાસી શકાયું નહીં — એડમિનનો સંપર્ક કરો'); }
      const f = flatOf(ent.fid);
      if (!f) return gerr('ફ્લેટ મળ્યો નહીં — એડમિનનો સંપર્ક કરો');
      if (db.users.some(u => u.phone === n)){
        gateStep = 'login'; renderGate();
        setTimeout(()=>{ const i=$('#gnum'); if(i) i.value = n; gerr('આ નંબર પહેલેથી નોંધાયેલો છે — PIN લખીને લોગિન કરો'); }, 60);
        return;
      }
      pendingFlat = f; gateStep = 'setpin'; renderGate(); return;
    }
    if(userByPhone(n)){
      gateStep = 'login'; renderGate();
      setTimeout(()=>{ const i=$('#gnum'); if(i) i.value = n; gerr('આ નંબર પહેલેથી નોંધાયેલો છે — PIN લખીને લોગિન કરો'); }, 60);
      return;
    }
    const matches = flatsForPhone(n);
    if(!matches.length) return gerr('આ નંબર સોસાયટીની યાદીમાં નથી — એડમિનનો સંપર્ક કરો');
    pendingFlat = matches[0];
    gateStep = 'setpin'; renderGate();
  };
  $('#gok').addEventListener('click', go);
  $('#gnum').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  setTimeout(()=>{ const i=$('#gnum'); if(i) i.focus(); }, 120);
}

function gerr(m){ const e=$('#ge'); if(e){ e.textContent=m; } }
function focusFix(){ const i=$('#gate .pin'); if(i) setTimeout(()=>i.focus(),120); }
$('#gate').addEventListener('click', e=>{
  const b = e.target.closest('[data-g]'); if(!b) return;
  gateStep = b.dataset.g; renderGate();
});

async function login(s){
  session = s; await sess.set(s);
  if (CRYPTO_OK && !dataKey){ dataKey = await newDataKey(); await syncAccounts(); await save(); }
  armLock();
  tab = 'home'; gateStep = 'signup';
  $('#gate').hidden = true;
  render();
  toast(s.role==='admin' ? 'એડમિન તરીકે લોગિન થયું'
      : s.role==='guard' ? 'સિક્યોરિટી તરીકે લોગિન થયું'
      : 'સ્વાગત છે, ' + (flatOf(s.flatId)?.owner||''));
}
async function logout(){
  if(!confirm('લોગ આઉટ કરવું છે?\n\nડેટા જશે નહીં. ફરી નંબર અને PIN થી લોગિન કરી શકશો.')) return;
  session = null; dataKey = null; await sess.set(null);
  db = emptyDb(); clearTimeout(lockTimer);
  gateStep = 'login'; renderGate();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const id = el.dataset.id, a = el.dataset.a;
  const MEMBER_OK  = ['receipt','addcomplaint','sharenotice','logout','pdfbill','pdfmine','exitpreview'];
  const GUARD_OK   = ['addvisitor','vout','addcomplaint','sharenotice','logout','exitpreview'];
  // billing operator: meter readings, bills, receipts, PDFs — no rates, no accounts, no data tools
  const BILLING_OK = ['genbills','editbill','pay','receipt','pdfbill','pdflist','pdfslips',
                      'remindall','notifyall','sharenotice','logout','exitpreview','lockapp'];
  if (isGuard()   && !GUARD_OK.includes(a))   return toast('આ કામ ફક્ત એડમિન કરી શકે');
  if (isMember()  && !MEMBER_OK.includes(a))  return toast('આ કામ ફક્ત એડમિન કરી શકે');
  if (isBilling() && !BILLING_OK.includes(a)) return toast('આ કામ ફક્ત એડમિન કરી શકે');
  if (a==='exitpreview'){ session = {role:'admin'}; tab='more'; render(); toast('એડમિન બાજુ પાછી'); return; }
  if (a==='preview') return formPreview();
  if (a==='guardpreview'){ session = {role:'guard', preview:true}; tab='home'; render(); return; }
  if (a==='logout') return logout();
  if (a==='pdflist') return pdfMonthList();
  if (a==='pdfslips') return pdfSlips();
  if (a==='pdfbill') return pdfOneBill(id);
  if (a==='pdfmine') return pdfMyStatement();
  if (a==='acctadmin') return formAccount('admin');
  if (a==='acctguard') return formAccount('guard');
  if (a==='members') return formMembers();
  if (a==='newuser') return formUserNew();
  if (a==='notifyall') return formNotifyAll();
  if (a==='settings') return formSettings();
  if (a==='addflat') return formFlat();
  if (a==='editflat') return formFlat(id);
  if (a==='genbills') return formUnits();
  if (a==='pay') return formPay(id);
  if (a==='editbill') return formBillEdit(id);
  if (a==='receipt') return showReceipt(id);
  if (a==='addnotice') return formNotice();
  if (a==='addcomplaint') return formComplaint();
  if (a==='addvisitor') return formVisitor();
  if (a==='addexpense') return formExpense();
  if (a==='resolve'){ db.complaints.find(c=>c.id===id).status='done'; await save(); render(); toast('ફરિયાદ ઉકેલાયેલી નોંધી'); return; }
  if (a==='vout'){ const v=db.visitors.find(v=>v.id===id); v.out=new Date().toTimeString().slice(0,5); await save(); render(); toast(`${v.name} બહાર — ${v.out}`); return; }
  if (a==='delnotice'){ if(confirm('આ નોટિસ કાઢી નાખવી છે?')){ db.notices=db.notices.filter(n=>n.id!==id); await save(); render(); } return; }
  if (a==='sharenotice'){ const n=db.notices.find(n=>n.id===id); shareText(`📌 ${db.society.name}\n\n${n.title}\n${n.body}\n\n— ${dateLabel(n.date)}`); return; }
  if (a==='godata'){ tab='data'; render(); window.scrollTo({top:0}); return; }
  if (a==='sec'){
    const k = el.dataset.k;
    if (!db.sec) db.sec = defaultSec();
    const turningOff = db.sec[k];

    if (k==='encrypt'){
      if (!CRYPTO_OK) return toast('આ રીતે ખોલવાથી એન્ક્રિપ્શન શક્ય નથી');
      if (turningOff && !confirm('એન્ક્રિપ્શન બંધ કરવું છે?\n\nપછી ફોનમાં બધાં નામ-નંબર ખુલ્લાં સચવાશે. ફોન કોઈના હાથમાં જાય તો વંચાઈ શકે.')) return;
      db.sec.encrypt = !turningOff;
      if (db.sec.encrypt){
        if (!dataKey) dataKey = await newDataKey();
        await syncAccounts();
        if (db.sec.selfSignup){ toast('યાદી તૈયાર થાય છે…'); await buildRoster(true); }
      } else {
        accounts = []; roster = []; rosterSig = '';
      }
      await save();
      render();
      return toast(db.sec.encrypt ? 'એન્ક્રિપ્શન ચાલુ — ડેટા હવે તાળામાં' : 'એન્ક્રિપ્શન બંધ કર્યું');
    }

    if (k==='attempts' && turningOff) await clearFail();
    db.sec[k] = !turningOff;
    if (k==='selfSignup'){
      if (db.sec[k]) toast('યાદી તૈયાર થાય છે…');
      await buildRoster(true);
    }
    await save(); render(); armLock();
    const NAMES = { autolock:'આપોઆપ લોક', attempts:'PIN મર્યાદા', maskPhone:'નંબર ઢાંકવાનું',
                    selfSignup:'જાતે સાઇન અપ' };
    return toast(`${NAMES[k]} ${db.sec[k]?'ચાલુ':'બંધ'} કર્યું`);
  }
  if (a==='lockapp'){ await lockNow(false); toast('એપ લોક થઈ'); return; }
  if (a==='checkupd'){ await checkForUpdate(false); return; }
  if (a==='hardreload'){
    toast('કેશ સાફ થાય છે…');
    try{
      if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
      if (navigator.serviceWorker){
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r=>r.unregister()));
      }
    }catch(err){}
    setTimeout(()=>location.reload(true), 600);
    return;
  }
  if (a==='remindall') return remindAll();
  if (a==='loginhelp') return shareText(`📱 ${db.society.name} — સોસાયટી એપ\n\n1) એપ ખોલો — પહેલું પાનું "સાઇન અપ" આવશે\n2) સોસાયટીમાં નોંધાવેલો તમારો મોબાઇલ નંબર લખો\n3) તમારો ફ્લેટ આપોઆપ જોડાઈ જશે\n4) તમારો પોતાનો ૪ આંકડાનો PIN બનાવો\n\nપછી દર વખતે નંબર + PIN થી લોગિન.\nતમે તમારાં બિલ, રસીદ, નોટિસ જોઈ શકશો અને ફરિયાદ નોંધાવી શકશો.\n\nનંબર ન મળે તો મને કહેજો — યાદીમાં અપડેટ કરી દઈશ.`);
  if (a==='report'){
    const mk=monthKey(), mb=db.bills.filter(b=>b.month===mk);
    const coll=mb.filter(b=>b.status==='paid').reduce((s,b)=>s+billTotal(b),0);
    const pend=mb.filter(b=>isDue(b)).reduce((s,b)=>s+billTotal(b),0);
    const exp=db.expenses.filter(e=>e.date.slice(0,7)===mk).reduce((s,e)=>s+e.amount,0);
    const units=mb.reduce((s,b)=>s+(b.units||0),0);
    return shareText(`📊 ${db.society.name}\n${monthLabel(mk)} નો હિસાબ\n\nકુલ ફ્લેટ: ${db.flats.length}\nપાણી યુનિટ: ${units}\n\nજમા થયું: ${money(coll)}\nબાકી: ${money(pend)}\nખર્ચ: ${money(exp)}\nબચત: ${money(coll-exp)}`);
  }
  if (a==='backup') return backup();
  if (a==='sharebackup') return shareBackup();
  if (a==='restore') return restore();
  if (a==='wipe'){
    if(confirm('બધો ડેટા કાયમ ભૂંસાઈ જશે (ફ્લેટની યાદી ફરી ભરાઈ જશે). ચાલુ રાખવું?')){
      db = { society:{name:'Royal Rejoice - 3',address:'',maint:800,unitRate:10,penalty:100,shopMaint:500,shopUnitRate:3}, auth:db.auth, users:db.users.filter(u=>u.role!=='member'), v:3,
             flats:SEED.map(s=>({id:uid(),...s})), bills:[],notices:[],complaints:[],visitors:[],expenses:[] };
      await save(); tab='home'; render(); toast('ડેટા રીસેટ થયો');
    } return;
  }
});

    <p class="muted" style="margin:0">${isA

    <label><span class="lb">લોગિન નંબર</span><input id="f1" type="tel" inputmode="numeric" maxlength="10" value="${esc(u?.phone||'')}"></label>
    <label><span class="lb">એડમિનનો હાલનો PIN (ખાતરી માટે)</span><input id="f2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
    <label><span class="lb">નવો PIN (ખાલી રાખો = ન બદલો)</span><input id="f3" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
    <label><span class="lb">નવો PIN ફરી લખો</span><input id="f4" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
    <p class="muted" style="margin-top:12px">PIN ભૂલી જવાય તો રીસેટ થઈ શકતો નથી — બેકઅપ ફાઇલ સાચવી રાખો.</p>
    <div class="btnrow"><button class="btn ghost" data-x="cancel">રદ કરો</button><button class="btn" id="ok">સાચવો</button></div>`);
  bind(async ()=>{
    if($('#f2').value.trim() !== adminUser().pin) return toast('એડમિનનો હાલનો PIN ખોટો છે');
    const ph = digits($('#f1').value);
    if(!ph) return toast('લોગિન નંબર લખો');
    const clash = db.users.find(x=>x.phone===ph && x.id!==u.id);
    if(clash) return toast('આ નંબર બીજા ખાતામાં વપરાયેલો છે');
    const np = $('#f3').value.trim();
    if(np){
      if(!/^\d{4}$/.test(np)) return toast('નવો PIN ૪ આંકડાનો હોવો જોઈએ');
      if(np !== $('#f4').value.trim()) return toast('બંને નવા PIN સરખા નથી');
      const other = role==='admin' ? guardUser() : adminUser();
      if(other && other.pin===np && other.phone===ph) return toast('બીજા ખાતા જેવો જ ન રાખો');
      u.pin = np;
    }
    u.phone = ph; u.name = $('#f0').value.trim() || u.name;
    if (np) u._newPin = np;
    await syncAccounts(); await save(); closeSheet(); render(); toast('ખાતું અપડેટ થયું');
  });
}

    if(!/^\d{4}$/.test(p)) return toast('PIN ૪ આંકડાનો હોવો જોઈએ');

                flatId: role==='member' ? $('#f3').value : null };
    db.users.push(u);
    await syncAccounts(); await save(); closeSheet(); render();
    toast(`${nm} નું ${ROLE_NAME[role]} ખાતું બન્યું`);

  });
}

function formNotifyAll(){
  const mk = billMonth || monthKey();

  openSheet(`<h3>બધાને જાણ કરો</h3>
    <p class="muted" style="margin:0">શું મોકલવું છે તે પસંદ કરો — સંદેશ તૈયાર થઈને
      WhatsApp ખૂલશે, ત્યાં સોસાયટીનું ગ્રુપ પસંદ કરી લેજો.</p>
    <label><span class="lb">સંદેશ</span><select id="f0">
      <option value="bill">${monthLabel(mk)} નાં બિલ તૈયાર છે</option>
      <option value="due">બાકી વસૂલીની યાદ</option>
      ${n?`<option value="notice">છેલ્લી નોટિસ — ${esc(n.title)}</option>`:''}
      <option value="own">મારો પોતાનો સંદેશ</option>
    </select></label>
    <label><span class="lb">સંદેશ (જોઈએ તો સુધારો)</span><textarea id="f1" style="min-height:150px"></textarea></label>
    <div class="btnrow"><button class="btn ghost" data-x="cancel">રદ કરો</button>
      <button class="btn" id="ok">WhatsApp ખોલો</button></div>`);
  const build = () => {
    const k = $('#f0').value;
    let t = '';
    if (k==='bill'){
      const tot = list.reduce((s,b)=>s+billTotal(b),0);
      t = `📢 ${db.society.name}\n\n${monthLabel(mk)} નાં મેન્ટેનન્સ અને પાણીનાં બિલ તૈયાર છે.\n\n`
        + `કુલ ${list.length} બિલ · ${money(tot)}\nમેન્ટેનન્સ: ફ્લેટ ${money(db.society.maint)}, શોપ ${money(db.society.shopMaint)}\n`
        + `પાણી: ₹${db.society.unitRate}/યુનિટ (શોપ ₹${db.society.shopUnitRate})\n\n`
        + `તમારું બિલ એપમાં જોઈ શકો છો. વહેલી તકે ભરવા વિનંતી 🙏`;
    } else if (k==='due'){
      const amt = due.reduce((s,b)=>s+billTotal(b),0);
      t = `🔔 ${db.society.name}\n\n${monthLabel(mk)} નું મેન્ટેનન્સ હજી ${due.length} ફ્લેટ/શોપનું બાકી છે.\n`
        + `કુલ બાકી: ${money(amt)}\n\nજેમનું બાકી હોય તે વહેલી તકે ભરી દેજો 🙏\n`
        + `(કોને કેટલું બાકી છે તે એપમાં પોતાના લોગિનમાં દેખાશે)`;
    } else if (k==='notice' && n){
      t = `📌 ${db.society.name}\n\n${n.title}\n${n.body}\n\n— ${dateLabel(n.date)}`;
    } else {
      t = `📢 ${db.society.name}\n\n`;
    }
    $('#f1').value = t;
  };
  $('#f0').addEventListener('change', build); build();
  bind(()=>{ const t=$('#f1').value.trim(); if(!t) return toast('સંદેશ લખો'); shareText(t); closeSheet(); });
}

          </div>`).join('')}</div>`}

        <input class="on" value="${esc(b?.otherNote||'')}" list="ol" placeholder="વધારાનો ચાર્જ શેનો? (ટેબલ-ખુરશી, હોલ…)">
      </div>`;
    }).join('') + `<datalist id="ol"><option>ટેબલ-ખુરશી વપરાશ</option><option>હોલ વપરાશ</option>
      <option>પાણીનું ટેન્કર</option><option>નુકસાન ભરપાઈ</option><option>ફાળો</option></datalist>`;
    recalc();
  };

  const recalc = () => {
    const fr = +$('#ur').value || 0, sr = +$('#us').value || 0, pen = +$('#up').value || 0;
    let total=0, units=0, n=0, carryT=0, extraT=0;
    $$('#ulist .fcard').forEach(r=>{
      if (r.classList.contains('done')) return;
      const f = flatOf(r.dataset.f);
      const rate = isShop(f) ? sr : fr;
      const pr=r.querySelector('.pr').value, cr=r.querySelector('.cr').value;
      const uBox=r.querySelector('.u');
      // if both readings are filled, the used units are worked out automatically
      if(String(cr).trim()!=='' ) uBox.value = usedUnits(pr, cr);
      const u=+uBox.value||0, c=+r.querySelector('.c').value||0;
      const mt=+r.querySelector('.m').value||0, o=+r.querySelector('.o').value||0;
      const penalty = c>0 ? pen : 0;
      const t = mt + u*rate + (f.parking||0) + o + penalty + c;
      units+=u; carryT+=c; extraT+=o+(f.parking||0)+penalty; total+=t; n++;
      r.querySelector('.ftot').textContent = money(t)
        + (String(cr).trim()!=='' && (+cr) < (+pr||0) ? ' ⚠' : '');
    });
    $('#utot').textContent = money(total);
    $('#usum').textContent = `${n} ફ્લેટ · ${units} યુનિટ · પાછલું ${money(carryT)} · વધારાના ${money(extraT)}`;
  };

  $('#um').addEventListener('change', drawList);
  $('#ur').addEventListener('input', recalc);
  $('#us').addEventListener('input', recalc);
  $('#up').addEventListener('input', recalc);
  $('#ulist').addEventListener('input', recalc);
  $('#fillm').addEventListener('click', ()=>{
    $$('#ulist .fcard:not(.done)').forEach(r=>{
      const f = flatOf(r.dataset.f);
      r.querySelector('.m').value = f.maint ?? defMaint(f);
    });
    recalc(); toast(`ફ્લેટમાં ${money(db.society.maint)}, શોપમાં ${money(db.society.shopMaint)} ભરાયું`);
  });
  drawList();

  $('#ok').addEventListener('click', async ()=>{
    const mm = $('#um').value || m;
    const fr = +$('#ur').value || 0, sr = +$('#us').value || 0, pen = +$('#up').value || 0;
    let made=0, upd=0;
    let backwards = [];
    $$('#ulist .fcard').forEach(r=>{
      if (r.classList.contains('done')) return;
      const f = flatOf(r.dataset.f);
      const rate = isShop(f) ? sr : fr;
      const prV=r.querySelector('.pr').value, crV=r.querySelector('.cr').value;
      const prevRead = String(prV).trim()==='' ? null : +prV;
      const currRead = String(crV).trim()==='' ? null : +crV;
      if (prevRead!=null && currRead!=null && currRead < prevRead) backwards.push(f.no);
      const u=+r.querySelector('.u').value||0, c=+r.querySelector('.c').value||0;
      const mt=+r.querySelector('.m').value||0, o=+r.querySelector('.o').value||0;
      const note = r.querySelector('.on').value.trim();
      const penalty = c>0 ? pen : 0;
      // older unpaid bills are folded into this bill's carry, so they stop counting on their own
      db.bills.filter(x=>x.flatId===f.id && x.month<mm && isDue(x)).forEach(x=>{ x.status='carried'; x.carriedTo=mm; });
      let b = db.bills.find(x=>x.flatId===f.id && x.month===mm);
      if(b){ Object.assign(b,{units:u,unitRate:rate,maint:mt,carry:c,other:o,otherNote:note,penalty,
             parking:f.parking||0, prevRead, currRead}); upd++; }
      else { db.bills.push({id:uid(),flatId:f.id,month:mm,maint:mt,units:u,unitRate:rate,
             prevRead, currRead, carry:c, parking:f.parking||0, other:o, otherNote:note, penalty,
             status:'due',paidOn:null,mode:null,receiptNo:null}); made++; }
    });
    db.society.unitRate = fr; db.society.shopUnitRate = sr; db.society.penalty = pen;
    billMonth = mm;
    await save(); closeSheet(); tab='bills'; render();
    toast(backwards.length
      ? `સચવાયું, પણ ${backwards.slice(0,3).join(', ')}${backwards.length>3?' વગેરે':''} નું અત્યારનું રીડિંગ પાછલા કરતાં ઓછું છે — તપાસી લેજો`
      : `${made} નવાં બિલ${upd?', '+upd+' અપડેટ':''}`);

  });
}

function printDoc(title, body){

  const f = document.createElement('iframe');
  f.id='printFrame'; f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);

  d.open();

  d.close();
  toast('પ્રિન્ટ ખૂલશે — “Save as PDF” પસંદ કરો');

}

function backupBlob(){
  return new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
}
function backupName(){ return 'royal-rejoice-3-' + today() + '.json'; }

function backup(){
  const a=document.createElement('a'); a.href=URL.createObjectURL(backupBlob());
  a.download=backupName(); a.click(); URL.revokeObjectURL(a.href);
  toast('બેકઅપ ફાઇલ ડાઉનલોડ થઈ');
}

/* send the backup straight to another device (WhatsApp, Drive, AirDrop…) */
async function shareBackup(){
  const file = new File([backupBlob()], backupName(), {type:'application/json'});
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Royal Rejoice-3 બેકઅપ',
        text:'Royal Rejoice-3 નો ડેટા — બીજા ફોનમાં ડેટા ટૅબમાંથી રિસ્ટોર કરો.' });
      return toast('મોકલાયું — બીજા ફોનમાં રિસ્ટોર કરો');
    }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  backup();
  toast('શેર થઈ શક્યું નહીં — ફાઇલ ડાઉનલોડ કરી, જાતે મોકલો');
}
function restore(){
  // no 'accept' filter: some Android file pickers hide .json files when it is set
  const inp=document.createElement('input'); inp.type='file';
  inp.style.cssText='position:fixed;left:-9999px';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const file=inp.files[0]; if(!file){ inp.remove(); return; }
    const r=new FileReader();
    r.onload=async()=>{ try{
        const d=JSON.parse(r.result);
        if(!d || !d.flats || !Array.isArray(d.flats)) throw 0;
        const keepAuth = db.auth, keepUsers = db.users;
        db=Object.assign({society:{name:'Royal Rejoice - 3',address:'',maint:800,unitRate:10,penalty:100,shopMaint:500,shopUnitRate:3},auth:keepAuth,flats:[],bills:[],notices:[],complaints:[],visitors:[],expenses:[]},d);
        if(!db.auth) db.auth = keepAuth;
        if(!Array.isArray(db.users) || !db.users.length) db.users = keepUsers;
        ensureUsers();
        db.flats.forEach(f=>{ if(!f.id) f.id=uid(); if(!f.kind) f.kind='flat'; });
        db.v = 2;
        await save(); tab='home'; render();
        toast(`${nFlats()} ફ્લેટ અને ${nShops()} શોપ આવી ગયાં`);
      }catch(err){ toast('આ ફાઇલ વાંચી શકાઈ નહીં — royal-rejoice-3-data.json પસંદ કરો'); }
      finally { inp.remove(); } };
    r.onerror=()=>{ toast('ફાઇલ ખૂલી નહીં'); inp.remove(); };
    r.readAsText(file); };
  inp.click();
}

window.RR3 = { get db(){return db}, set db(v){db=v}, get session(){return session},
               set session(v){session=v}, get tab(){return tab}, set tab(v){tab=v},
               render, save, isAdmin, isGuard, nFlats, nShops };


/* ---------- always-latest: check a tiny version file ---------- */
let updateSeen = false;
async function checkForUpdate(silent){
  if (location.protocol === 'file:') { if(!silent) toast('આ ફાઇલ સીધી ખોલી છે — અપડેટ જાતે ડાઉનલોડ કરવું પડશે'); return; }
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw 0;
    const v = await r.json();
    if (v.version && v.version !== APP_VERSION){
      updateSeen = true;
      const bar = document.getElementById('updbar');
      document.getElementById('updTxt').textContent = `નવું વર્ઝન ${v.version} આવ્યું છે`;
      bar.hidden = false;
    } else if (!silent){
      toast('તમારી પાસે સૌથી નવું વર્ઝન છે');
    }
  }catch(e){ if(!silent) toast('તપાસી શકાયું નહીં — ઇન્ટરનેટ ચકાસો'); }
}

async function applyUpdate(){
  toast('અપડેટ થાય છે…');
  try{
    if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if (navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
  }catch(e){}
  setTimeout(()=>location.reload(), 500);
}

document.getElementById('updBtn').addEventListener('click', applyUpdate);
document.getElementById('updClose').addEventListener('click', () => {
  document.getElementById('updbar').hidden = true;
});

// check when the app opens, when it comes back to the foreground, and every 15 min
window.addEventListener('load', () => setTimeout(()=>checkForUpdate(true), 2500));
document.addEventListener('visibilitychange', () => { if (!document.hidden && !updateSeen) checkForUpdate(true); });
setInterval(() => { if (!updateSeen) checkForUpdate(true); }, 15 * 60000);

/* ---------- boot ---------- */
(async function(){
  const stored = await raw.get(KEY);
  let saved = null;
  if (stored && stored.enc){
    accounts = stored.accounts || [];      // locked: only hashes, nothing readable
    roster = stored.roster || [];
    db = emptyDb();
    if (stored.sec) db.sec = Object.assign(defaultSec(), stored.sec);
    session = null;
    gateStep = accounts.length ? 'login' : 'signup';
    renderGate();
    return;
  }
  saved = stored;
  // BUGFIX: keep everything that was saved — accounts, settings, notices — even
  // when the flat list is still empty. Previously an empty list threw the whole
  // file away, so each launch looked like a fresh install.
  if (saved && typeof saved === 'object') db = Object.assign(db, saved);
  if (!Array.isArray(db.flats) || !db.flats.length) db.flats = SEED.map(s=>({id:uid(), ...s}));
  if (!Array.isArray(db.users)) db.users = [];
  if (!db.auth) db.auth = { pin:'', admin:'' };
  db.sec = Object.assign(defaultSec(), db.sec || {});
  ensureUsers();
  if (db.society.shopMaint == null) db.society.shopMaint = 500;
  if (db.society.shopUnitRate == null) db.society.shopUnitRate = 3;
  // one-time: add the shops to installs created before shops existed
  if (db.v !== 2){
    SEED.filter(x=>x.kind==='shop').forEach(sh=>{
      if (!db.flats.some(f=>f.no === sh.no)) db.flats.push({id:uid(), ...sh});
    });
    db.flats.forEach(f=>{ if(!f.kind) f.kind = 'flat'; });
    db.v = 2; await save();
  }
  if (!saved) await save();

  const s = await sess.get();
  if (s && s.userId && db.users.some(u=>u.id===s.userId)) session = s;
  else if (s && s.role === 'admin' && adminUser()) session = s;
  else if (s && s.role === 'member' && flatOf(s.flatId)) session = s;

  if (session) render(); else renderGate();
})();
</script>
